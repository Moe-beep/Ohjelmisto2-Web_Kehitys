<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="https://api.tvmaze.com/search/shows">
  <input id="query" name="q" type="text" />
  <input type="submit" value="Search" />
</form>

<script>
    async function searchShows(name) {
        const response = await fetch(`https://api.tvmaze.com/search/shows?q=${name}`);
        if(!response.ok) throw new Error("Invalid input!");
        const info = await response.json();
        const show = info[0].show;

        console.log("result", show);

    }

    document.addEventListener("submit", async function (evt) {
        evt.preventDefault();
        const name = document.querySelector("#query").value;
        try {
            await searchShows(name);
        } catch (e) {
            console.log("error", e);
        }
    });
</script>
</body>
</html>
