
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show Search</title>
</head>
<body>

<form>
    <input id="query" name="q" type="text" />
    <input type="submit" value="Search" />
</form>

<div id="results"></div>

<script>
    async function searchShows(name) {
        const response = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(name)}`);

        if (!response.ok) throw new Error("Invalid input!");

        const info = await response.json();

        const results = document.querySelector("#results");

        // Clear old search results
        results.innerHTML = '';

        // Loop through all search results
        for (const tvShow of info) {

            const show = tvShow.show;

            const title = show.name;
            const url = show.url;
            const image = show.image?.medium;
            const summary = show.summary;

            // Create article
            const article = document.createElement("article");

            // Create heading
            const heading = document.createElement("h2");
            heading.textContent = title;

            // Create link
            const link = document.createElement("a");
            link.href = url;
            link.textContent = "View details";
            link.target = "_blank";

            // Create image
            const img = document.createElement("img");
            img.src = image || "";
            img.alt = title;

            // Create summary
            const description = document.createElement("div");
            description.innerHTML = summary || "No summary available.";

            // Append elements to article
            article.appendChild(heading);
            article.appendChild(link);

            if (image) {
                article.appendChild(img);
            }

            article.appendChild(description);

            // Append article to results
            results.appendChild(article);
        }
    }

    document.addEventListener("submit", async function (evt) {
        evt.preventDefault();

        const name = document.querySelector("#query").value;

        try {
            await searchShows(name);
        } catch (e) {
            console.log("error", e);
        }
    });
</script>

</body>
</html>
